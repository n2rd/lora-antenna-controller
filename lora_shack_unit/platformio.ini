; PlatformIO Project Configuration File
;
; Build options: build flags, source and extra script
; Upload options: custom upload port, speed and extra flags
; Library options: dependencies, extra library storages
; Advanced options: extra scripting
;
; Please visit documentation for other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = heltec_wifi_lora_32_V3
description = LoRa Antenna Controller - Remote antenna azimuth control (Heltec V3)

[env:heltec_wifi_lora_32_V3]
platform = espressif32
board = heltec_wifi_lora_32_V3
framework = arduino
; Build options
board_build.mcu = esp32s3
board_build.f_cpu = 240000000L
; Upload options
upload_protocol = esptool
upload_speed = 921600
; After flashing, perform a hard reset so board boots into app (not ROM bootloader)
; esptool --after hard_reset is the correct arg form for espressif32 platform
board_upload.after_reset = hard_reset
; Monitor options
monitor_speed = 115200
monitor_filters = time, log2file
; Prevent monitor DTR/RTS from resetting the board when connecting
monitor_dtr = 0
monitor_rts = 0
; Use VID:PID match so monitor survives ACM0/ACM1 re-enumeration on reset
monitor_port = hwgrep://303A:1001
upload_port  = hwgrep://303A:1001
lib_deps =
    jgromes/RadioLib@^7.0.0
    adafruit/Adafruit MCP23017 Arduino Library@^2.3.2
    olikraus/U8g2@^2.35.9
; Build flags for Heltec V3 (ESP32-S3, USB CDC)
build_flags =
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D HELTEC_V3